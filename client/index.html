<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      A strict CSP is part of the security posture, not decoration: the local
      vault key lives in this origin's JavaScript memory while unlocked, so
      script injection is the most damaging client-side failure available.
      'wasm-unsafe-eval' is required to instantiate the core-crypto WASM module.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss: http: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <!--
      frame-ancestors cannot be delivered in a <meta> element; browsers ignore
      it there. A deployment must send it (and ideally the whole policy) as a
      Content-Security-Policy response header. See DEVELOPMENT.md.
    -->
    <meta name="referrer" content="no-referrer" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236ea8fe'/%3E%3Cpath d='M11 14v-2a5 5 0 0110 0v2h1.5a1.5 1.5 0 011.5 1.5v8a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 018 23.5v-8A1.5 1.5 0 019.5 14H11zm2 0h6v-2a3 3 0 00-6 0v2z' fill='%2306121f'/%3E%3C/svg%3E"
    />
    <title>Cipherlink — private messaging</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Cipherlink needs JavaScript to encrypt and decrypt messages locally.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
